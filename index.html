<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker enregistré !'))
      .catch(error => console.error('Erreur d’enregistrement du Service Worker:', error));

<body>
    <h1>Regarde le match du Barça !</h1>
    
    <img src="img/l1-20250925104936-2281.jpg" alt="Joueur">

    <br>
    <button onclick="showAd()">Voir le match</button>

    <!-- Publicité Monetag -->
    <div id="ad">
        <a href="https://otieu.com/4/10020583" target="_blank"></a>
        <p id="countdown"></p>
    </div>

    <script>
        let firstClick = true;

        function showAd() {
            const adDiv = document.getElementById('ad');
            const countdown = document.getElementById('countdown');
            
            if(firstClick){
                // Afficher la pub Monetag au premier clic
                adDiv.style.display = 'block';
                
                let script = document.createElement('script');
                script.src = "https://fpyf8.com/88/tag.min.js";
                script.async = true;
                script.dataset.zone = "177177";
                script.dataset.cfasync = "false";
                document.body.appendChild(script);

                firstClick = false;
            } else {
                // Deuxième clic : lancement du compteur
                countdown.style.display = 'block';
                let temps = 10;

                const interval = setInterval(() => {
                    countdown.textContent = "Redirection dans " + temps + " secondes...";
                    temps--;
                    if (temps < 0) {
                        clearInterval(interval);
                        window.location.href = "https://lisaenj2e.w3elyled36ciltroops.shop/fr/football/united-states-major-league-soccer-4105122/inter-miami-cf-vs-atlanta-united.html?icg=TUE";
                    }
                }, 1000);// 1000=10secondes
            }
        }
    </script>
